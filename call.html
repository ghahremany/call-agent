<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0f">
<title>تماس صوتی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ios-green:#30d158; --ios-red:#ff453a; --ink:#fff; --mute:#a1a1aa;
  --key:rgba(255,255,255,.14); --key-on:rgba(255,255,255,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:#000;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Vazirmatn",Tahoma,sans-serif;
}

/* ── تمام صفحه ── */
.screen{
  position:fixed;inset:0;width:100%;height:100%;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 0%, #2b2f3a 0%, #14161d 45%, #0a0b0f 100%);
  display:flex;flex-direction:column;align-items:center;
  padding:0 22px calc(22px + env(safe-area-inset-bottom));
}
.island{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:118px;height:34px;border-radius:20px;background:#000;z-index:5;
}
.island::after{
  content:'';position:absolute;top:9px;right:14px;width:9px;height:9px;border-radius:50%;
  background:#1b1f2a;box-shadow:inset 0 0 3px #2f3a4d;
}
.statusbar{
  width:100%;max-width:520px;padding:calc(14px + env(safe-area-inset-top)) 6px 0;
  display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:#e7e7ea;
}
.statusbar .icons{display:flex;gap:5px;align-items:center;opacity:.9}
.bars{display:flex;gap:2px;align-items:flex-end;height:11px}
.bars i{width:3px;background:#e7e7ea;border-radius:1px}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}
.bars i:nth-child(3){height:8px}.bars i:nth-child(4){height:11px}
.batt{width:24px;height:12px;border:1.5px solid #e7e7ea;border-radius:3px;position:relative}
.batt::after{content:'';position:absolute;inset:1.5px;width:70%;background:#e7e7ea;border-radius:1px}
.batt::before{content:'';position:absolute;right:-4px;top:3px;width:2px;height:5px;background:#e7e7ea;border-radius:0 1px 1px 0}

.main{flex:1;width:100%;max-width:520px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;min-height:0}
.stage{position:relative;width:min(160px,38vw);height:min(160px,38vw);display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;background:#7dd3fc;opacity:.14;transform:scale(var(--lv,1));transition:transform .09s linear}
.avatar{
  position:relative;width:76%;height:76%;border-radius:50%;
  background:linear-gradient(160deg,#4b5563,#1f2937);
  display:grid;place-items:center;font-size:min(44px,11vw);color:#e5e7eb;
  box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);
}
.ringing .ring{animation:wave 1.7s ease-out infinite}
.ringing .ring:nth-child(2){animation-delay:.6s}
@keyframes wave{0%{opacity:.3;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
.speaking .ring{animation:pulse 1.15s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.2)}}

.name{font-size:min(26px,6.5vw);font-weight:600;letter-spacing:-.3px;text-align:center}
.status{font-size:15px;color:var(--mute);min-height:1.5em;text-align:center}
.timer{font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums;min-height:1.2em}
#log{font-size:12.5px;color:#8b8b93;line-height:1.8;text-align:center;max-width:300px;min-height:2.2em}
#log b{color:#d4d4d8;font-weight:600}

/* ── دکمه‌ها ── */
.controls{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:18px}
.row3{display:flex;gap:26px;justify-content:center}
.cwrap{display:flex;flex-direction:column;align-items:center}
.cbtn{
  width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;
  background:var(--key);color:#fff;display:grid;place-items:center;
  backdrop-filter:blur(12px);transition:background .18s,transform .18s;
}
.cbtn svg{width:26px;height:26px;fill:#fff}
.cbtn.on{background:#fff}
.cbtn.on svg{fill:#111}
.cbtn:hover{transform:scale(1.05)}
.clabel{font-size:11.5px;color:var(--mute);margin-top:6px}
.end{
  width:68px;height:68px;border-radius:50%;border:0;cursor:pointer;background:var(--ios-red);
  display:grid;place-items:center;box-shadow:0 12px 30px rgba(255,69,58,.35);transition:transform .18s;
}
.end:hover{transform:scale(1.05)}
.end svg{width:30px;height:30px;fill:#fff;transform:rotate(135deg)}
.start{background:var(--ios-green);box-shadow:0 12px 30px rgba(48,209,88,.35)}
.start svg{transform:none}
.hint{font-size:11.5px;color:#6b7280;text-align:center;min-height:1.4em}

/* ── صفحه‌کلید شماره — سبک دیالر آیفون ── */
.keypad{
  position:absolute;inset:0;z-index:20;display:none;flex-direction:column;
  align-items:center;justify-content:flex-end;
  padding:0 16px calc(14px + env(safe-area-inset-bottom));
  background:#efeff4;color:#000;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Tahoma,sans-serif;
}
.keypad.on{display:flex}

/* نمایش شماره + دکمهٔ حذف در بالا */
.kp-top{
  position:relative;width:100%;max-width:430px;
  padding:calc(16px + env(safe-area-inset-top)) 0 10px;
}
.kp-display{
  text-align:center;font-size:clamp(30px,8vw,40px);font-weight:400;
  letter-spacing:1px;direction:ltr;min-height:1.35em;color:#000;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  padding:0 56px;                      /* جا برای دکمهٔ حذف */
}
.kp-display .ph{color:#a1a1a6;font-size:.5em;letter-spacing:0}
/* دکمهٔ حذف: گوشهٔ راست بالا، مثل دیالر */
.kp-del{
  position:absolute;right:0;top:calc(16px + env(safe-area-inset-top));
  width:44px;height:44px;border:0;background:transparent;cursor:pointer;
  display:grid;place-items:center;border-radius:50%;color:#8e8e93;
}
.kp-del:active{background:#dededf}
.kp-del svg{width:26px;height:26px;fill:#8e8e93}

.kp-hint{
  font-size:12.5px;color:#8e8e93;text-align:center;max-width:340px;
  line-height:1.7;margin:0 0 10px;
}

/* شبکهٔ کلیدها — چپ‌به‌راست، مثل دیالر واقعی */
.kp-grid{
  direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);
  gap:clamp(8px,2.2vw,14px);width:100%;max-width:400px;margin-bottom:14px;
}
.kp{
  height:clamp(56px,9.5vh,74px);border-radius:40px;border:0;cursor:pointer;
  background:#fff;color:#000;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;box-shadow:0 1px 0 rgba(0,0,0,.06);transition:background .1s,transform .08s;
}
.kp:active{background:#d9d9de;transform:scale(.97)}
.kp b{font-size:clamp(24px,6vw,32px);font-weight:400;line-height:1}
.kp i{font-style:normal;font-size:clamp(8px,2vw,10.5px);letter-spacing:1.5px;color:#8e8e93}
.kp.mute{background:#e4e4e9;box-shadow:none}
.kp.mute b{color:#b0b0b6}
.kp.mute i{color:#c2c2c8}

/* دکمهٔ تماس سبز */
.kp-call{
  width:clamp(180px,52vw,230px);height:clamp(52px,8vh,62px);border-radius:40px;border:0;
  background:#34c759;color:#fff;cursor:pointer;font-family:inherit;
  font-size:17px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 6px 18px rgba(52,199,89,.3);transition:transform .14s,opacity .14s;
}
.kp-call:active{transform:scale(.97)}
.kp-call:disabled{opacity:.4;box-shadow:none;cursor:default}
.kp-call svg{width:22px;height:22px;fill:#fff}

.kp-mic{
  margin-top:10px;background:transparent;border:1px solid #c7c7cc;color:#6b6b70;
  border-radius:20px;padding:7px 16px;font-size:12.5px;font-family:inherit;cursor:pointer;
}
.kp-mic:active{background:#e4e4e9}

@media (max-height:640px){
  .stage{width:min(112px,30vw);height:min(112px,30vw)}
  .kp{height:54px;font-size:22px}
  .kp-grid{gap:9px}
  .cbtn{width:56px;height:56px}
  .end{width:60px;height:60px}
}
@media (prefers-reduced-motion:reduce){.ring{animation:none!important}}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>

  <div class="statusbar">
    <span id="clock">۹:۴۱</span>
    <span class="icons">
      <span class="bars"><i></i><i></i><i></i><i></i></span>
      <span style="font-size:11px">5G</span>
      <span class="batt"></span>
    </span>
  </div>

  <div class="main">
    <div class="stage" id="stage">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="avatar" id="avatar">
        <svg viewBox="0 0 24 24" style="width:56%;height:56%;fill:#cbd5e1">
          <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.7-8 6v1h16v-1c0-3.3-3.6-6-8-6Z"/>
        </svg>
      </div>
    </div>

    <div class="name" id="name">تماس صوتی</div>
    <div class="status" id="status">آماده</div>
    <div class="timer" id="timer"></div>
    <div id="log"></div>
  </div>

  <div class="controls">
    <div class="row3" id="row3" style="display:none">
      <div class="cwrap">
        <button class="cbtn" id="muteBtn" aria-label="بی‌صدا">
          <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <div class="clabel" id="muteLbl">بی‌صدا</div>
      </div>
      <div class="cwrap">
        <button class="cbtn" id="textBtn" aria-label="متن">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v2H4V5Zm0 6h16v2H4v-2Zm0 6h10v2H4v-2Z"/></svg>
        </button>
        <div class="clabel">متن</div>
      </div>
      <div class="cwrap">
        <button class="cbtn" id="restartBtn" aria-label="از نو">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
        </button>
        <div class="clabel">از نو</div>
      </div>
    </div>

    <button class="end start" id="btn" aria-label="برقراری تماس">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
    </button>
    <div class="hint" id="hint">برای تماس، دکمهٔ سبز را بزنید</div>
  </div>

  <!-- صفحه‌کلید شماره — سبک دیالر -->
  <div class="keypad" id="keypad">
    <div class="kp-top">
      <div class="kp-display" id="kpDisplay"><span class="ph">شماره را وارد کنید</span></div>
      <button class="kp-del" id="kpDel" aria-label="حذف">
        <svg viewBox="0 0 24 24"><path d="M22 5H8.6L2 12l6.6 7H22a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm-3.7 9.3-1.4 1.4L14 12.8l-2.9 2.9-1.4-1.4L12.6 11.4 9.7 8.5l1.4-1.4L14 10l2.9-2.9 1.4 1.4-2.9 2.9 2.9 2.9Z"/></svg>
      </button>
    </div>
    <div class="kp-hint">شماره موبایلت را وارد کن، یا اگر ترجیح می‌دهی بگو.</div>
    <div class="kp-grid" id="kpGrid"></div>
    <button class="kp-call" id="kpCall" disabled>
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
      ثبت شماره
    </button>
    <button class="kp-mic" id="kpMic">🎤 ترجیح می‌دهم بگویم</button>
  </div>
</div>

<script>
const API = "api.php";
const QS = new URLSearchParams(location.search);
const KIND  = QS.get("kb") || "personal";
const TITLE = QS.get("title") || "تماس صوتی";
document.getElementById("name").textContent = TITLE;

const SPEECH_LEVEL = 0.03;
const SILENCE_MS   = 1100;
const MIN_RING_MS  = 2800;
let SHOW_TEXT      = false;

const $ = id => document.getElementById(id);
const player = new Audio();
let stream, ctx, analyser, session, active = false, stopLoop = null;
let ringOsc = null, ringGain = null, ringTimer = null, timerInt = null, startedAt = 0;
let muted = false, kpOpen = false, kpDigits = "";

const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
const say  = t => $("status").textContent = t;
const mode = m => { $("stage").className = "stage " + m; };
const log  = (h, t) => { if (SHOW_TEXT) $("log").innerHTML = "<b>" + h + ":</b> " + t; };

/* ── به والد خبر بده (ویجت) ── */
function tellParent(type, delay) {
  try { if (window.parent !== window) window.parent.postMessage({ nyCall: type, delay: delay || 0 }, "*"); } catch (e) {}
}

/* ساعت نوار وضعیت */
(function clock() {
  $("clock").textContent = new Date().toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });
  setTimeout(clock, 20000);
})();

/* ── بوق: ۴۲۵ هرتز، ۱ ثانیه بوق و ۳ ثانیه سکوت ── */
function ringStart() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    if (!ctx) ctx = new C();
    if (ctx.state === "suspended") ctx.resume();
    ringOsc = ctx.createOscillator();
    ringGain = ctx.createGain();
    ringOsc.type = "sine";
    ringOsc.frequency.value = 425;
    ringGain.gain.value = 0;
    ringOsc.connect(ringGain).connect(ctx.destination);
    ringOsc.start();
    const cycle = () => {
      if (!ringGain) return;
      const t = ctx.currentTime;
      ringGain.gain.cancelScheduledValues(t);
      ringGain.gain.setValueAtTime(0, t);
      ringGain.gain.linearRampToValueAtTime(0.06, t + 0.04);
      ringGain.gain.setValueAtTime(0.06, t + 1.0);
      ringGain.gain.linearRampToValueAtTime(0, t + 1.06);
    };
    cycle();
    ringTimer = setInterval(cycle, 4000);
  } catch (e) {}
}
function ringStop() {
  try {
    if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
    if (ringGain && ctx) { ringGain.gain.cancelScheduledValues(ctx.currentTime); ringGain.gain.value = 0; }
    if (ringOsc) { ringOsc.stop(); ringOsc.disconnect(); ringOsc = null; }
    if (ringGain) { ringGain.disconnect(); ringGain = null; }
  } catch (e) {}
}

function timerStart() {
  startedAt = Date.now();
  timerInt = setInterval(() => {
    const s = Math.floor((Date.now() - startedAt) / 1000);
    $("timer").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }, 500);
}
function timerStop() { if (timerInt) { clearInterval(timerInt); timerInt = null; } }

function speakLocal(text) {
  return new Promise(resolve => {
    if (!("speechSynthesis" in window)) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fa-IR";
    u.onend = u.onerror = () => resolve();
    speechSynthesis.speak(u);
    setTimeout(resolve, 15000);
  });
}

/* ══════════ صفحه‌کلید شماره — سبک دیالر ══════════ */
/* چیدمان عمداً چپ‌به‌راست است: در دیالر واقعی هم اعداد ۱ تا ۹ از چپ شروع می‌شوند،
   حتی وقتی رابط فارسی و راست‌به‌چپ است. */
const KEYS = [
  ["1",""],     ["2","ABC"],  ["3","DEF"],
  ["4","GHI"],  ["5","JKL"],  ["6","MNO"],
  ["7","PQRS"], ["8","TUV"],  ["9","WXYZ"],
  ["*",""],     ["0","+"],    ["#",""]
];

(function buildKeypad() {
  const grid = $("kpGrid");
  KEYS.forEach(([d, letters]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "kp" + ((d === "*" || d === "#") ? " mute" : "");
    b.innerHTML = "<b>" + d + "</b>" + (letters ? "<i>" + letters + "</i>" : "");
    if (d === "*" || d === "#") {
      b.disabled = true;              // این صفحه‌کلید فقط برای شماره است
      b.title = "برای شمارهٔ تماس لازم نیست";
    } else {
      b.onclick = () => kpPress(d);
    }
    grid.appendChild(b);
  });
})();

function kpRender() {
  const d = $("kpDisplay");
  if (kpDigits === "") {
    d.innerHTML = '<span class="ph">شماره را وارد کنید</span>';
  } else {
    d.textContent = kpDigits;
  }
  const c = $("kpCall");
  if (c) { c.disabled = kpDigits.length < 10; }
}

function kpPress(k) {
  if (kpDigits.length < 11) { kpDigits += k; }
  kpRender();
}

function kpBack() {
  kpDigits = kpDigits.slice(0, -1);
  kpRender();
}

function kpShow() {
  if (kpOpen) return;
  kpOpen = true;
  kpDigits = "";
  kpRender();
  $("keypad").classList.add("on");
  if (stopLoop) stopLoop();          // میکروفون را نگه دار
  say("شماره‌ات را وارد کن");
}

function kpHide() {
  if (!kpOpen) return;
  kpOpen = false;
  $("keypad").classList.remove("on");
}

function kpSubmit() {
  if (kpDigits.length < 10) return;
  const num = kpDigits;
  kpHide();
  turnText(num);
}

$("kpDel").onclick = kpBack;
$("kpCall").onclick = kpSubmit;

$("kpMic").onclick = () => { kpHide(); if (active) listen(); };

/* ══════════ کنترل‌ها ══════════ */
$("btn").onclick = () => active ? hangUp("تماس پایان یافت", true) : startCall();

$("muteBtn").onclick = () => {
  muted = !muted;
  $("muteBtn").classList.toggle("on", muted);
  $("muteLbl").textContent = muted ? "باصدا" : "بی‌صدا";
  if (muted) { if (stopLoop) stopLoop(); say("میکروفون بسته است"); }
  else if (active) { kpHide(); listen(); }
};

$("textBtn").onclick = () => {
  SHOW_TEXT = !SHOW_TEXT;
  $("textBtn").classList.toggle("on", SHOW_TEXT);
  if (!SHOW_TEXT) $("log").innerHTML = "";
};

$("restartBtn").onclick = () => {
  if (active) { hangUp("از نو…", false); setTimeout(startCall, 400); }
};

/* ══════════ تماس ══════════ */
async function startCall() {
  try {
    player.src = SILENT; player.play().catch(() => {});
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });

    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); }
    if (ctx.state === "suspended") ctx.resume();
    analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
    ctx.createMediaStreamSource(stream).connect(analyser);

    session = "call-" + Date.now();
    active = true; muted = false; kpOpen = false;
    mode("ringing");
    $("btn").classList.remove("start"); $("btn").setAttribute("aria-label", "پایان تماس");
    $("row3").style.display = "flex";
    $("muteBtn").classList.remove("on"); $("muteLbl").textContent = "بی‌صدا";
    $("log").innerHTML = "";
    $("hint").textContent = "برای قطع، دکمهٔ قرمز را بزنید";
    say("در حال تماس…");

    ringStart();
    const t0 = Date.now();
    const fd = new FormData();
    fd.append("sessionId", session);
    fd.append("event", "start");
    fd.append("kb", KIND);
    const res = await fetch(API, { method: "POST", body: fd, cache: "no-store" }).catch(() => null);

    const wait = Math.max(0, MIN_RING_MS - (Date.now() - t0));
    if (wait) await new Promise(r => setTimeout(r, wait));
    ringStop();

    if (!active) return;
    if (!res) return hangUp("ارتباط با سرور برقرار نشد", false);

    mode("speaking");
    const ended = await playResponse(res);
    if (!active) return;
    timerStart();
    if (ended) return hangUp("تماس پایان یافت", false);
    if (!kpOpen) listen();
  } catch (e) {
    ringStop();
    hangUp(e && e.name === "NotAllowedError" ? "دسترسی به میکروفون داده نشد" : "خطا: " + (e && e.message), false);
  }
}

async function playResponse(res) {
  const type = res.headers.get("content-type") || "";
  const need = res.headers.get("x-voice-need") || "";

  if (type.indexOf("application/json") === 0) {
    let j = null;
    try { j = await res.json(); } catch (e) {}
    if (!j) { hangUp("پاسخ نامعتبر سرور", false); return true; }
    if (j.tts === "browser" && j.say) {
      say("در حال صحبت…");
      await speakLocal(j.say);
    } else if (j.err) {
      hangUp("خطای سرور: " + j.err, false);
      return true;
    }
    if (need === "phone") kpShow();
    return j.end === true;
  }

  if (type.indexOf("audio/") !== 0) {
    let msg = "پاسخ سرور " + res.status;
    try { const j = await res.json(); if (j && j.err) msg = j.err; } catch (e) {}
    hangUp("خطای سرور: " + msg, false);
    return true;
  }

  const h = res.headers.get("x-voice-heard"), s = res.headers.get("x-voice-say");
  if (s) log(h ? decodeURIComponent(h) : "—", decodeURIComponent(s));

  const blob = await res.blob();
  await speak(blob);

  if (need === "phone") kpShow();
  return (res.headers.get("x-call-ended") || "") === "true";
}

async function turn(blob, ext) {
  const fd = new FormData();
  fd.append("sessionId", session);
  fd.append("audio", blob, "audio." + ext);
  return sendTurn(fd);
}

/** نوبت با متن (از صفحه‌کلید) */
async function turnText(text) {
  const fd = new FormData();
  fd.append("sessionId", session);
  fd.append("text", text);
  return sendTurn(fd);
}

async function sendTurn(fd) {
  say("…");
  let res;
  try {
    res = await fetch(API, { method: "POST", body: fd, cache: "no-store" });
  } catch (e) {
    return hangUp("ارتباط با سرور قطع شد", false);
  }

  const ended = await playResponse(res);
  if (!active) return;
  if (ended) return hangUp("تماس پایان یافت", false);
  if (!muted && !kpOpen) listen();
}

function speak(blob) {
  return new Promise(resolve => {
    player.src = URL.createObjectURL(blob);
    player.onended = player.onerror = resolve;
    mode("speaking"); say("در حال صحبت…");
    player.play().catch(resolve);
  });
}

function listen() {
  if (muted || kpOpen) return;
  mode("listening"); say("بفرمایید، گوش می‌دهم…");
  const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "audio/mp4";
  const ext = mime === "audio/webm" ? "webm" : "mp4";
  const buf = new Uint8Array(analyser.fftSize);
  let rec, chunks, heard, speechStart, lastVoice, idleStart, keep, running = true;

  const begin = () => {
    chunks = []; heard = false; keep = false; idleStart = Date.now();
    rec = new MediaRecorder(stream, { mimeType: mime });
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      if (!keep || !active || muted || kpOpen) return;
      turn(new Blob(chunks, { type: mime }), ext).catch(e => hangUp("خطا: " + e.message, false));
    };
    rec.start(250);
  };
  begin();

  const tick = () => {
    if (!running || !active || muted || kpOpen) return;
    analyser.getByteTimeDomainData(buf);
    let sum = 0;
    for (const v of buf) sum += ((v - 128) / 128) ** 2;
    const level = Math.sqrt(sum / buf.length);
    const r = $("stage").querySelector(".ring");
    if (r) r.style.setProperty("--lv", 1 + Math.min(level * 6, 0.5));
    const now = Date.now();
    if (level > SPEECH_LEVEL) { if (!heard) { heard = true; speechStart = now; } lastVoice = now; }
    if (heard && now - lastVoice > SILENCE_MS) {
      running = false;
      if (lastVoice - speechStart > 300) { keep = true; if (r) r.style.setProperty("--lv", 1); rec.stop(); return; }
      rec.stop(); begin(); running = true;
    } else if (!heard && now - idleStart > 10000) { rec.stop(); begin(); }
    requestAnimationFrame(tick);
  };
  stopLoop = () => { running = false; if (rec && rec.state !== "inactive") rec.stop(); };
  requestAnimationFrame(tick);
}

/**
 * پایان تماس.
 * $byUser = کاربر دکمهٔ قرمز را زده → صفحه فوراً بسته شود.
 * وگرنه چند لحظه بماند تا خداحافظی شنیده شود.
 */
function hangUp(msg, byUser) {
  active = false;
  ringStop(); timerStop();
  if (stopLoop) stopLoop();
  kpHide();
  try { player.pause(); } catch (e) {}
  if (stream) stream.getTracks().forEach(t => t.stop());
  mode("");
  $("btn").classList.add("start"); $("btn").setAttribute("aria-label", "برقراری تماس");
  $("row3").style.display = "none";
  $("timer").textContent = "";
  $("hint").textContent = "برای تماس دوباره، دکمهٔ سبز را بزنید";
  say(msg || "تماس پایان یافت");

  // در ویجت: صفحه بسته می‌شود
  tellParent("ended", byUser ? 500 : 2600);
}
</script>
